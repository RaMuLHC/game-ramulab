<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="#a855f7" stroke-width="12" />
  <!-- Gamepad Path -->
  <g filter="url(#glow)">
    <path d="M376,180 H136 C105,180 80,205 80,236 V276 C80,307 105,332 136,332 H376 C407,332 432,307 432,276 V236 C432,205 407,180 376,180 Z" fill="#1e1b4b" stroke="url(#primary-grad)" stroke-width="16" stroke-linejoin="round" />
    <!-- D-Pad -->
    <path d="M140,256 H180 M160,236 V276" stroke="#c084fc" stroke-width="12" stroke-linecap="round" />
    <!-- Action Buttons -->
    <circle cx="320" cy="270" r="12" fill="#ec4899" />
    <circle cx="352" cy="242" r="12" fill="#3b82f6" />
    <!-- Menu Buttons -->
    <line x1="236" y1="256" x2="252" y2="256" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <line x1="260" y1="256" x2="276" y2="256" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
